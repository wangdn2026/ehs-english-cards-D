<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cite — 传讯、处罚；引用 · Day1</title>
<style>
:root {
  --primary: #5BA4B5;
  --primary-light: #7BB8C6;
  --accent: #E8845C;
  --ink: #2C2C2C;
  --bg-warm: #FDF8F0;
  --text-secondary: #6A6A7A;
  --text-light: #9A9AAA;
  --border: #E8E2DA;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #F5F0E8;
  font-family: 'PingFang SC', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Microsoft YaHei', sans-serif;
  min-height: 100vh;
  padding: 32px 20px 60px;
  color: var(--ink);
}

.page-header {
  text-align: center;
  margin-bottom: 28px;
}
.page-header .pkg-badge {
  display: inline-block;
  background: var(--primary);
  color: #fff;
  font-size: 12px;
  font-weight: 600;
  padding: 4px 12px;
  border-radius: 12px;
  letter-spacing: 1px;
  margin-bottom: 12px;
}
.page-header h1 {
  font-size: 20px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 4px;
}
.page-header .subtitle {
  font-size: 13px;
  color: var(--text-secondary);
}

/* ===== Card ===== */
.card {
  max-width: 460px;
  margin: 0 auto;
  background: #FFFFFF;
  border-radius: 20px;
  border: 2px solid var(--primary);
  box-shadow: 0 8px 32px rgba(91, 164, 181, 0.10);
  padding: 32px 28px;
  position: relative;
}

/* 顶部标签 */
.card-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}
.cat-tag {
  background: rgba(91, 164, 181, 0.10);
  color: var(--primary);
  font-size: 12px;
  font-weight: 600;
  padding: 4px 12px;
  border-radius: 10px;
}
.cat-id {
  font-size: 12px;
  color: var(--text-light);
  font-family: ui-monospace, 'SF Mono', Menlo, monospace;
}

/* 主单词 */
.word-block {
  text-align: center;
  margin: 16px 0 28px;
}
.word-en {
  font-size: 36px;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: -0.5px;
  margin-bottom: 6px;
  line-height: 1.2;
}
.word-zh {
  font-size: 16px;
  color: var(--text-secondary);
  font-weight: 500;
}

/* 中部播放区 */
.audio-block {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  margin-bottom: 28px;
  padding: 16px;
  background: var(--bg-warm);
  border-radius: 14px;
}
.play-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: 999px;
  padding: 10px 18px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.1s, background 0.2s;
}
.play-btn:hover { background: var(--primary-light); }
.play-btn:active { transform: scale(0.96); }
.play-btn .icon {
  width: 16px;
  height: 16px;
  display: inline-block;
  background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'><path d='M8 5v14l11-7z'/></svg>") no-repeat center / contain;
}
.qr-wrap {
  text-align: center;
}
.qr-wrap img {
  width: 64px;
  height: 64px;
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}
.qr-cap {
  font-size: 10px;
  color: var(--text-light);
  margin-top: 4px;
}

/* 例句区 */
.example-block {
  border-top: 1px dashed var(--border);
  padding-top: 18px;
}
.example-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 14px;
}
.example-row:last-child { margin-bottom: 0; }
.example-play {
  flex-shrink: 0;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: rgba(232, 132, 92, 0.10);
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s, transform 0.1s;
  margin-top: 2px;
}
.example-play:hover { background: rgba(232, 132, 92, 0.20); }
.example-play:active { transform: scale(0.92); }
.example-play .icon {
  width: 12px;
  height: 12px;
  display: inline-block;
  background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23E8845C'><path d='M8 5v14l11-7z'/></svg>") no-repeat center / contain;
}
.example-text { flex: 1; }
.example-en {
  font-size: 14px;
  color: var(--ink);
  line-height: 1.55;
  margin-bottom: 4px;
}
.example-zh {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.5;
}

/* 翻页 */
.nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 24px;
  padding-top: 18px;
  border-top: 1px solid var(--border);
}
.nav a {
  font-size: 13px;
  color: var(--primary);
  text-decoration: none;
  padding: 8px 14px;
  border-radius: 8px;
  transition: background 0.2s;
}
.nav a:hover { background: rgba(91, 164, 181, 0.10); }
.nav .nav-home {
  flex: 1;
  font-size: 18px;
  padding: 10px 12px;
}
.nav .nav-disabled {
  color: var(--text-light);
  cursor: not-allowed;
  pointer-events: none;
  opacity: 0.5;
}

/* 底部 brand */
.brand-foot {
  text-align: center;
  margin-top: 18px;
  font-size: 11px;
  color: var(--text-light);
  letter-spacing: 0.5px;
}
.brand-foot .accent { color: var(--accent); }

/* 卡片底部水印 */
.card-foot {
  text-align: center;
  margin-top: 18px;
  padding-top: 14px;
  border-top: 1px solid var(--border);
  font-size: 11px;
  color: var(--text-light);
  letter-spacing: 1px;
}
</style>
</head>
<body>

<div class="page-header">
  <span class="pkg-badge">PACKAGE D · Day1</span>
  <h1>医院门诊 & 承包商安全管理（一）</h1>
  <div class="subtitle">Day1: Hospital Outpatient & Contractor Safety Management (I)</div>
</div>

<div class="card">
  <div class="card-head">
    <span class="cat-tag">承包商安全管理</span>
    <span class="cat-id">#d1_con_v01</span>
  </div>

  <div class="word-block">
    <div class="word-en">cite</div>
    <div class="word-zh">传讯、处罚；引用</div>
  </div>

  <div class="audio-block">
    <button class="play-btn" onclick="playAudio('../audio/d1_con_v01_word.mp3')" aria-label="播放单词发音">
      <span class="icon"></span>单词发音
    </button>
    <div class="qr-wrap">
      <img src="../img/d1_con_v01_qr.png" alt="扫码听发音" width="64" height="64">
      <div class="qr-cap">扫码听单词</div>
    </div>
  </div>

  <div class="example-block">
    <div class="example-row">
      <button class="example-play" onclick="playAudio('../audio/d1_con_v01_example.mp3')" aria-label="播放例句"></button>
      <div class="example-text">
        <div class="example-en">The inspector will cite any contractor who violates the E. H. S. rules.</div>
        <div class="example-zh">检查员会对违反 E. H. S. 规定的承包商开具处罚。</div>
      </div>
    </div>
  </div>

  <div class="card-foot">
    安全五点半 · E. H. S. 职场英语词卡
  </div>
</div>

<div class="nav">
  <a class="$PREV_CLASS" href="d1_con_p15.html">← 上一张</a>
  <a class="nav-home" href="../index.html">🏠</a>
  <a class="$NEXT_CLASS" href="d1_con_v02.html">下一张 →</a>
</div>

<div class="brand-foot">安全五点半 · <span class="accent">E. H. S.</span> 职场英语</div>

<script>
function playAudio(src) {
  try {
    const a = new Audio(src);
    a.play().catch(e => {
      // 音频文件未就绪时静默忽略
      console.warn('音频未就绪:', src);
    });
  } catch (e) { console.warn(e); }
}
</script>

</body>
</html>
